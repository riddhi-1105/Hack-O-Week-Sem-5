<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-tabs .nav-link.active { font-weight: 600; }
    </style>
</head>
<body>

<div class="container" style="max-width: 1000px;">
    <h2 class="mb-4 text-center">📚 Library Management System</h2>

    <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="books">Books</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="members">Members</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="borrow">Borrow / Return</button></li>
    </ul>

    <!-- ===================== BOOKS TAB ===================== -->
    <div id="tab-books" class="tab-pane">
        <div class="card mb-4 p-4">
            <h5>Add a New Book</h5>
            <form id="addBookForm" class="row g-3">
                <div class="col-md-3"><input type="text" id="bookTitle" class="form-control" placeholder="Title" required></div>
                <div class="col-md-3"><input type="text" id="bookAuthor" class="form-control" placeholder="Author" required></div>
                <div class="col-md-2"><input type="text" id="bookIsbn" class="form-control" placeholder="ISBN"></div>
                <div class="col-md-2"><input type="text" id="bookGenre" class="form-control" placeholder="Genre"></div>
                <div class="col-md-1"><input type="number" id="bookCopies" class="form-control" placeholder="Copies" min="1" value="1" required></div>
                <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">Add</button></div>
            </form>
        </div>
        <div class="card p-4">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Title</th><th>Author</th><th>Genre</th><th>Available</th><th>Action</th></tr>
                </thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ===================== MEMBERS TAB ===================== -->
    <div id="tab-members" class="tab-pane d-none">
        <div class="card mb-4 p-4">
            <h5>Register a Member</h5>
            <form id="addMemberForm" class="row g-3">
                <div class="col-md-3"><input type="text" id="memberName" class="form-control" placeholder="Name" required></div>
                <div class="col-md-3"><input type="email" id="memberEmail" class="form-control" placeholder="Email" required></div>
                <div class="col-md-2"><input type="text" id="memberPhone" class="form-control" placeholder="Phone"></div>
                <div class="col-md-3"><input type="text" id="memberAddress" class="form-control" placeholder="Address"></div>
                <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">Add</button></div>
            </form>
        </div>
        <div class="card p-4">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Action</th></tr>
                </thead>
                <tbody id="memberTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ===================== BORROW TAB ===================== -->
    <div id="tab-borrow" class="tab-pane d-none">
        <div class="card mb-4 p-4">
            <h5>Borrow a Book</h5>
            <form id="borrowForm" class="row g-3">
                <div class="col-md-4">
                    <select id="borrowBookId" class="form-select" required><option value="">Select a book...</option></select>
                </div>
                <div class="col-md-4">
                    <select id="borrowMemberId" class="form-select" required><option value="">Select a member...</option></select>
                </div>
                <div class="col-md-2"><button type="submit" class="btn btn-success w-100">Borrow</button></div>
            </form>
        </div>
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Active Loans</h5>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadBorrowRecords('active')">Active</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadBorrowRecords('history')">History</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="loadBorrowRecords('overdue')">Overdue</button>
                </div>
            </div>
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr><th>Record</th><th>Book</th><th>Member</th><th>Due</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="borrowTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://127.0.0.1:8000/api";

    // ---------- Tab switching ----------
    document.querySelectorAll("#mainTabs .nav-link").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("#mainTabs .nav-link").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            document.querySelectorAll(".tab-pane").forEach(p => p.classList.add("d-none"));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.remove("d-none");
            if (btn.dataset.tab === "borrow") populateBorrowDropdowns();
        });
    });

    // ---------- Books ----------
    async function fetchBooks() {
        const res = await fetch(`${API_BASE}/books/`);
        const books = await res.json();
        const tbody = document.getElementById("bookTableBody");
        tbody.innerHTML = "";
        books.forEach(book => {
            tbody.innerHTML += `
                <tr>
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.genre ?? "-"}</td>
                    <td><span class="badge ${book.available > 0 ? 'bg-success' : 'bg-warning'}">${book.available} / ${book.total_copies}</span></td>
                    <td><button onclick="deleteBook(${book.id})" class="btn btn-sm btn-danger">Delete</button></td>
                </tr>`;
        });
        return books;
    }

    document.getElementById("addBookForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            title: document.getElementById("bookTitle").value,
            author: document.getElementById("bookAuthor").value,
            isbn: document.getElementById("bookIsbn").value || null,
            genre: document.getElementById("bookGenre").value || null,
            total_copies: parseInt(document.getElementById("bookCopies").value) || 1
        };
        const res = await fetch(`${API_BASE}/books/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            e.target.reset();
            document.getElementById("bookCopies").value = 1;
            fetchBooks();
        } else {
            const err = await res.json();
            alert("Error adding book: " + (err.detail || res.statusText));
        }
    });

    async function deleteBook(id) {
        if (!confirm("Delete this book?")) return;
        const res = await fetch(`${API_BASE}/books/${id}`, { method: "DELETE" });
        if (res.ok) fetchBooks();
        else { const err = await res.json(); alert("Error: " + (err.detail || res.statusText)); }
    }

    // ---------- Members ----------
    async function fetchMembers() {
        const res = await fetch(`${API_BASE}/members/`);
        const members = await res.json();
        const tbody = document.getElementById("memberTableBody");
        tbody.innerHTML = "";
        members.forEach(m => {
            tbody.innerHTML += `
                <tr>
                    <td>${m.id}</td><td>${m.name}</td><td>${m.email}</td><td>${m.phone ?? "-"}</td>
                    <td><button onclick="deleteMember(${m.id})" class="btn btn-sm btn-danger">Delete</button></td>
                </tr>`;
        });
        return members;
    }

    document.getElementById("addMemberForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById("memberName").value,
            email: document.getElementById("memberEmail").value,
            phone: document.getElementById("memberPhone").value || null,
            address: document.getElementById("memberAddress").value || null
        };
        const res = await fetch(`${API_BASE}/members/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (res.ok) { e.target.reset(); fetchMembers(); }
        else { const err = await res.json(); alert("Error: " + (err.detail || res.statusText)); }
    });

    async function deleteMember(id) {
        if (!confirm("Remove this member?")) return;
        const res = await fetch(`${API_BASE}/members/${id}`, { method: "DELETE" });
        if (res.ok) fetchMembers();
        else { const err = await res.json(); alert("Error: " + (err.detail || res.statusText)); }
    }

    // ---------- Borrow / Return ----------
    async function populateBorrowDropdowns() {
        const books = await fetchBooks();
        const members = await fetchMembers();

        const bookSel = document.getElementById("borrowBookId");
        bookSel.innerHTML = `<option value="">Select a book...</option>`;
        books.filter(b => b.available > 0).forEach(b => {
            bookSel.innerHTML += `<option value="${b.id}">${b.title} (${b.available} available)</option>`;
        });

        const memberSel = document.getElementById("borrowMemberId");
        memberSel.innerHTML = `<option value="">Select a member...</option>`;
        members.forEach(m => {
            memberSel.innerHTML += `<option value="${m.id}">${m.name}</option>`;
        });

        loadBorrowRecords("active");
    }

    document.getElementById("borrowForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            book_id: parseInt(document.getElementById("borrowBookId").value),
            member_id: parseInt(document.getElementById("borrowMemberId").value)
        };
        const res = await fetch(`${API_BASE}/borrow/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            populateBorrowDropdowns();
        } else {
            const err = await res.json();
            alert("Error: " + (err.detail || res.statusText));
        }
    });

    async function returnBook(recordId) {
        const res = await fetch(`${API_BASE}/borrow/return`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ record_id: recordId })
        });
        if (res.ok) loadBorrowRecords("active");
        else { const err = await res.json(); alert("Error: " + (err.detail || res.statusText)); }
    }

    async function loadBorrowRecords(kind) {
        const res = await fetch(`${API_BASE}/borrow/${kind}`);
        const records = await res.json();
        const tbody = document.getElementById("borrowTableBody");
        tbody.innerHTML = "";
        records.forEach(r => {
            const due = new Date(r.due_date).toLocaleDateString();
            let statusBadge;
            if (r.is_returned) statusBadge = `<span class="badge bg-secondary">Returned</span>`;
            else if (r.is_overdue) statusBadge = `<span class="badge bg-danger">Overdue</span>`;
            else statusBadge = `<span class="badge bg-success">Active</span>`;

            tbody.innerHTML += `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.book_title}</td>
                    <td>${r.member_name}</td>
                    <td>${due}</td>
                    <td>${statusBadge}</td>
                    <td>${r.is_returned ? "-" : `<button onclick="returnBook(${r.id})" class="btn btn-sm btn-primary">Return</button>`}</td>
                </tr>`;
        });
    }

    // ---------- Initial load ----------
    fetchBooks();
</script>

</body>
</html>
